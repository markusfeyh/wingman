[project]
name = "wingman"
version = "0.1.0"
description = "Conference copilot: who you meet, what you share, what you owe them"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "falkordb>=1.8.1",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
    "zxing-cpp>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
